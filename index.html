<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birra y Bíceps - Cotizador de Membresías</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="header-banner">
      <div class="header-container">
        <h1>💪 Birra y Bíceps 🍺</h1>
        <p class="slogan">
          Entrenamiento de alta intensidad y buena cerveza: La vida es equilibrio
        </p>
      </div>
    </header>

    <main class="main-container">
      <section class="card div-cotizador">
        <h2>Calculá tu Membresía</h2>
        <form id="formCotizador">
          <div class="form-group">
            <label for="plan">Seleccioná tu plan:</label>
            <select id="plan" required>
              <option value="" selected disabled>Elegí un plan...</option>
            </select>
            <p class="descripcion-plan" id="descripcionPlan"></p>
          </div>

          <div class="form-group">
            <label for="sucursal">Seleccioná la sucursal:</label>
            <select id="sucursal" required>
              <option value="" selected disabled>Elegí una sucursal...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="duracion">Duración de la membresía:</label>
            <select id="duracion">
              <option value="1">1 mes (Precio regular)</option>
              <option value="3">3 meses (5% de descuento)</option>
              <option value="6">6 meses (10% de descuento)</option>
              <option value="12" selected>12 meses (20% de descuento)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="adicionales-titulo">Servicios Adicionales (opcionales):</label>
            <div class="adicionales-container" id="adicionalesContainer">
              <!-- Checkboxes generados dinámicamente -->
            </div>
          </div>

          <div class="precio-container">
            <p class="precio-label">
              Precio Mensual Estimado:
              <span class="precio-valor">$ <span id="precioMensual">0.00</span></span>
            </p>
            <p class="precio-label">
              Total del Contrato:
              <span class="precio-total">$ <span id="precioTotal">0.00</span></span>
            </p>
          </div>

          <button type="submit" id="btnContratar" class="button button-primary">
            💪 Contratar Membresía
          </button>
        </form>
      </section>

      <section class="card historial-section">
        <div class="historial-header">
          <h2>📋 Membresías Cotizadas y Guardadas</h2>
          <button type="button" id="btnLimpiarHistorial" class="button button-outline">
            Limpiar Historial
          </button>
        </div>
        <ul id="historialLista" class="historial-lista">
          <!-- Historial de cotizaciones  -->
        </ul>
      </section>
    </main>

    <footer class="footer">
      <p>🏋️ Musculación | 🥗 Nutrición | 🍺 Cervecería Artesanal Exclusiva</p>
    </footer>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
